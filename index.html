<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界の地図 — 縦断・横断宇宙図</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07070e;
  --cosmos: #050812;
  --sky1: #0a0e1f;
  --sky2: #0d1228;
  --surface: #0c0c10;
  --underground: #060609;
  --water: #080f1a;

  --c-star: #d4e0f8;
  --c-galaxy: #8aaecc;
  --c-train: #c9b46a;
  --c-station: #a89060;
  --c-city: #8a8078;
  --c-school: #7a8898;
  --c-safe: #8cc99c;
  --c-danger: #c97b7b;
  --c-super: #b08cc9;
  --c-hidden: #7ac9c0;
  --c-room: #c9a07a;
  --c-white-room: #c8ccd8;
  --c-water: #4a7ab8;
  --c-mirror: #6a9acc;
  --c-moth: #c9a07a;
  --c-tunnel: #5a5a7a;

  --text: #c8c4b8;
  --text-dim: #6a6660;
  --text-bright: #ece7d8;
  --border: #1e1e2e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Serif JP', serif; font-size: 13px; display: flex; flex-direction: column; }

/* ── HEADER ── */
.hdr { flex-shrink: 0; padding: 18px 28px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 20px; background: rgba(7,7,14,.95); }
.hdr-title { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 700; color: var(--text-bright); }
.hdr-sub { font-size: 10px; letter-spacing: .3em; color: var(--text-dim); }
.view-toggle { margin-left: auto; display: flex; gap: 0; }
.vbtn { padding: 7px 16px; font-size: 10px; letter-spacing: .2em; color: var(--text-dim); cursor: pointer; border: 1px solid var(--border); background: transparent; font-family: 'Noto Serif JP', serif; transition: all .2s; }
.vbtn:first-child { border-radius: 2px 0 0 2px; }
.vbtn:last-child { border-radius: 0 2px 2px 0; border-left: none; }
.vbtn.active { color: var(--c-train); border-color: var(--c-train); background: rgba(201,180,106,.06); }

/* ── LAYOUT ── */
.body { flex: 1; display: flex; overflow: hidden; }
.map-area { flex: 1; overflow: hidden; position: relative; }
.panel { width: 280px; flex-shrink: 0; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(8,8,16,.96); }
.panel-hdr { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 10px; letter-spacing: .25em; color: var(--text-dim); }
.panel-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
.panel-empty { color: var(--text-dim); font-size: 12px; line-height: 1.9; }

/* PANEL content */
.p-name { font-family: 'Shippori Mincho', serif; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.p-layer { font-size: 9px; letter-spacing: .25em; padding: 2px 8px; border: 1px solid; border-radius: 2px; display: inline-block; margin-bottom: 12px; }
.p-meaning { font-size: 12px; color: var(--text); line-height: 1.9; margin-bottom: 12px; }
.p-atmo { background: rgba(255,255,255,.03); border: 1px solid var(--border); padding: 10px 12px; font-size: 11.5px; color: var(--text-dim); line-height: 1.8; margin-bottom: 10px; border-radius: 2px; }
.p-atmo-lbl { font-size: 9px; letter-spacing: .2em; color: var(--text-dim); margin-bottom: 4px; }
.p-quote { border-left: 2px solid var(--border); padding: 8px 12px; font-size: 11px; color: var(--text-dim); font-style: italic; margin-top: 8px; line-height: 1.7; }
.p-relation { margin-top: 12px; font-size: 11px; color: var(--text-dim); }
.p-relation-title { font-size: 9px; letter-spacing: .2em; margin-bottom: 6px; color: var(--text-dim); }
.rel-tag { display: inline-block; padding: 2px 7px; border: 1px solid var(--border); border-radius: 2px; margin: 2px; font-size: 10px; cursor: pointer; transition: border-color .2s; }
.rel-tag:hover { border-color: var(--c-train); }

/* ── MAP CANVAS ── */
#mapCanvas { width: 100%; height: 100%; cursor: grab; }
#mapCanvas:active { cursor: grabbing; }

/* location nodes on SVG */
.loc-node { cursor: pointer; transition: opacity .2s; }
.loc-node:hover { opacity: .75; }

/* ── LEGENDS ── */
.legend-bar { position: absolute; bottom: 12px; left: 14px; display: flex; flex-wrap: wrap; gap: 10px; pointer-events: none; opacity: .7; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 9px; color: var(--text-dim); }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; }

/* animations */
@keyframes twinkle { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
@keyframes flow { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }
@keyframes ripple { 0%,100% { opacity: .3; } 50% { opacity: .7; } }
@keyframes pulse-glow { 0%,100% { filter: drop-shadow(0 0 2px currentColor); } 50% { filter: drop-shadow(0 0 8px currentColor); } }

.star-a { animation: twinkle 2.5s ease-in-out infinite; }
.star-b { animation: twinkle 3.8s ease-in-out infinite .8s; }
.star-c { animation: twinkle 4.2s ease-in-out infinite 1.6s; }
.flow-path { animation: flow 4s linear infinite; }
.ripple-el { animation: ripple 3s ease-in-out infinite; }
.pulse-el { animation: pulse-glow 3s ease-in-out infinite; }

/* VIEW TRANSITIONS */
.view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transition: opacity .4s; }
.view.hidden { opacity: 0; pointer-events: none; }

/* ── MOBILE RESPONSIVENESS ── */
@media (max-width: 768px) {
  .hdr { flex-direction: column; align-items: flex-start; gap: 12px; padding: 12px 16px; }
  .view-toggle { margin-left: 0; width: 100%; }
  .vbtn { flex: 1; text-align: center; }
  .body { flex-direction: column; }
  .map-area { flex: none; height: 55vh; width: 100%; }
  .panel { width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border); }
  .legend-bar { bottom: auto; top: 12px; } /* レジェンドがスマホで邪魔にならないよう調整 */
}
</style>
</head>

    <button class="vbtn" id="btn-h" onclick="setView('horizontal')">横断図　地理軸</button>

function showInfo(id) {
  const d = INFO[id];
  if (!d) return;
  const body = document.getElementById('panelBody');
  const rels = (d.relations || []).map(r => {
    const rd = INFO[r];
    if (!rd) return '';
    return `<span class="rel-tag" onclick="showInfo('${r}')" style="color:${rd.color};border-color:${rd.color}40">${rd.name}</span>`;
  }).join('');
  
  body.innerHTML = `
    <div class="p-name" style="color:${d.color}">${d.name}</div>
    <div class="p-layer" style="color:${d.color};border-color:${d.color}60">${d.layer}</div>
    <div class="p-meaning">${d.meaning}</div>
    <div class="p-atmo-lbl">雰囲気・空気感</div>
    <div class="p-atmo">${d.atmo}</div>
    ${d.quote ? `<div class="p-quote">「${d.quote}」</div>` : ''}
    ${rels ? `<div class="p-relation"><div class="p-relation-title">関連する場所</div>${rels}</div>` : ''}
  `;
  
  // Highlight selected node
  document.querySelectorAll('.loc-node').forEach(n => n.style.opacity = n.dataset.id === id ? '1' : '0.6');
}

let currentView = 'vertical';

function setView(v) {
  currentView = v;
  document.getElementById('vmap').classList.toggle('hidden', v !== 'vertical');
  document.getElementById('hmap').classList.toggle('hidden', v !== 'horizontal');
  document.getElementById('btn-v').classList.toggle('active', v === 'vertical');
  document.getElementById('btn-h').classList.toggle('active', v === 'horizontal');
  document.getElementById('panelBody').innerHTML = '<div class="panel-empty">場所をクリックすると<br>詳細が表示されます。</div>';
  document.querySelectorAll('.loc-node').forEach(n => n.style.opacity = '1');
}
